<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="SAFTA Insights">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#062720"/><stop offset="55%" stop-color="#1B6E56"/><stop offset="100%" stop-color="#2FA58C"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#63BD69"/><stop offset="48%" stop-color="#2FA58C"/><stop offset="100%" stop-color="#4689C8"/>
</linearGradient>
<clipPath id="cp"><rect width="1600" height="1000"/></clipPath>
