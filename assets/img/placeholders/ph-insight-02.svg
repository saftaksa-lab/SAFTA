<path d="M8 142 C50 100 100 50 142 8"/>
</g>
</g>
<g opacity=".9">
<text x="800" y="452" text-anchor="middle" fill="#7FD08A"
 font-family="'Space Grotesk','Inter',system-ui,sans-serif" font-size="34" font-weight="600" letter-spacing="9">SAFTA INSIGHTS</text>
<text x="800" y="556" text-anchor="middle" fill="#FFFFFF" direction="rtl"
 font-family="'IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif" font-size="62" font-weight="600">مركز الرؤى</text>
